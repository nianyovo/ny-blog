<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#221C35"/>
      <stop offset="55%" stop-color="#1A1628"/>
      <stop offset="100%" stop-color="#12101C"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="32%" stop-color="#A855F7"/>
      <stop offset="68%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.68" cy="0.38" r="0.45">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FDE047" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#wall)"/>

  <!-- Window Frame Outer Rim -->
  <rect x="176" y="56" width="448" height="458" rx="14" fill="#2D2644" stroke="#4C3F70" stroke-width="2"/>
  <rect x="194" y="74" width="412" height="422" rx="8" fill="url(#sky)"/>
  <rect x="194" y="74" width="412" height="422" rx="8" fill="url(#sunGlow)"/>

  <!-- Stars & Crescent in Upper Violet Sky -->
  <circle cx="248" cy="122" r="2.2" fill="#FFF" opacity="0.85"/>
  <circle cx="312" cy="108" r="1.6" fill="#BAE6FD" opacity="0.75"/>
  <circle cx="540" cy="116" r="2.0" fill="#FFF" opacity="0.7"/>
  <circle cx="276" cy="166" r="1.5" fill="#FDE68A" opacity="0.8"/>

  <!-- Glowing Sunset Orb -->
  <circle cx="476" cy="228" r="54" fill="#FEF9C3" opacity="0.95"/>

  <!-- Soft Pink & Violet Clouds -->
  <path d="M194 252 Q265 232 332 250 T460 246 L460 272 L194 272 Z" fill="#F9A8D4" opacity="0.35"/>
  <path d="M360 202 Q430 185 510 200 T606 196 L606 218 L360 218 Z" fill="#DDD6FE" opacity="0.28"/>

  <!-- Distant Cyan-Indigo Mountain Silhouettes -->
  <path d="M194 374 Q295 304 420 352 T606 332 L606 496 L194 496 Z" fill="#312E81" opacity="0.78"/>
  <path d="M194 418 Q356 364 606 402 L606 496 L194 496 Z" fill="#1E1B4B" opacity="0.92"/>

  <!-- Window Panes -->
  <rect x="396" y="74" width="8" height="422" fill="#1F1930"/>
  <rect x="194" y="282" width="412" height="8" fill="#1F1930"/>
  <rect x="164" y="502" width="472" height="16" rx="6" fill="#3B3154"/>

  <!-- Lush Emerald Potted Monstera on Sill -->
  <ellipse cx="268" cy="426" rx="24" ry="36" transform="rotate(-28 268 426)" fill="#059669"/>
  <ellipse cx="312" cy="418" rx="22" ry="38" transform="rotate(20 312 418)" fill="#10B981"/>
  <ellipse cx="290" cy="412" rx="18" ry="32" fill="#34D399"/>
  <rect x="262" y="446" width="56" height="56" rx="8" fill="#EA580C"/>
  <rect x="258" y="444" width="64" height="10" rx="4" fill="#FB923C"/>

  <!-- Glass Prism Bottle Catching Cyan Light -->
  <rect x="512" y="454" width="26" height="48" rx="8" fill="#38BDF8" fill-opacity="0.55" stroke="#BAE6FD" stroke-width="1.5"/>
  <circle cx="525" cy="448" r="5" fill="#F472B6"/>

  <!-- Diagonal Prismatic Sunbeam -->
  <polygon points="194,74 606,74 780,600 290,600" fill="url(#beam)"/>
</svg>
